  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #0ea5e9;
      --primary-dark: #0284c7;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* En-tête */
    header {
      padding: calc(var(--safe-top) + 8px) 16px 10px;
      background: var(--surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -0.3px;
    }

    .brand span {
      color: var(--primary);
    }

    .cv-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      font-weight: 600;
    }

    .cv-badge.ready {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
    }

    /* Conteneur principal des vues */
    main {
      flex: 1;
      position: relative;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .view {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100%;
    }

    .view.active {
      display: flex;
    }

    /* VUE 1 : Accueil & Liste des pages */
    .home-container {
      padding: 16px;
      display: flex
