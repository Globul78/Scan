<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Mekohm Scan" />
  <meta name="theme-color" content="#0f172a" />
  <title>Mekohm Scan — Weekly Invoices</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icon-192.png" />

  <!-- Libraries: jsPDF, PDF.js, OpenCV.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script async src="https://docs.opencv.org/4.9.0/opencv.js" onload="onOpenCvReady();"></script>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --primary: #0ea5e9;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --safe-top: env(safe-area-inset-top, 20px);
      --safe-bottom: env(safe-area-inset-bottom, 20px);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    header { padding: calc(var(--safe-top) + 8px) 16px 10px; background: var(--surface); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.08); z-index: 10; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
    .brand span { color: var(--primary); }
    .cv-badge { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(245, 158, 11, 0.2); color: #fbbf24; font-weight: 600; }
    .cv-badge.ready { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    main { flex: 1; position: relative; overflow-y: auto; display: flex; flex-direction: column; }
    .view { display: none; flex: 1; flex-direction: column; height: 100%; }
    .view.active { display: flex; }
    .home-container { padding: 14px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .filename-box { background: var(--surface); padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); }
    .filename-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .filename-header label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .clear-week-btn { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; padding: 4px 9px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .clear-week-btn:disabled { opacity: 0.35; pointer-events: none; }
    .filename-input-wrap { display: flex; align-items: center; background: var(--bg); border-radius: 10px; padding: 0 10px; border: 1px solid var(--surface-light); }
    .filename-input-wrap input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; padding: 10px 0; outline: none; user-select: text; font-weight: 600; }
    .filename-input-wrap span { color: var(--text-muted); font-size: 14px; font-weight: 600; }
    .week-nav { display: flex; gap: 6px; margin-top: 10px; }
    .week-btn { flex: 1; background: var(--surface-light); color: var(--text); border: 1px solid transparent; border-radius: 8px; padding: 7px 6px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .week-btn:active { transform: scale(0.97); }
    .week-btn.active-week { background: rgba(14, 165, 233, 0.2); border-color: var(--primary); color: var(--primary); }
    .pages-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; flex: 1; align-content: start; padding-bottom: 12px; }
    .page-card { position: relative; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column; }
    .page-thumb { position: relative; width: 100%; aspect-ratio: 3/4; background: #000; display: flex; align-items: center; justify-content: center; }
    .page-thumb img { width: 100%; height: 100%; object-fit: contain; }
    .page-badge { position: absolute; top: 8px; left: 8px; background: rgba(15, 23, 42, 0.88); padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #38bdf8; }
    .page-date { position: absolute; bottom: 6px; left: 6px; right: 6px; background: rgba(15, 23, 42, 0.85); padding: 3px 6px; border-radius: 5px; font-size: 10px; color: var(--text-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .delete-page { position: absolute; top: 6px; right: 6px; background: rgba(239, 68, 68, 0.9); color: white; border: none; width: 26px; height: 26px; border-radius: 50%; font-size: 16px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .card-controls { display: flex; background: var(--surface); border-top: 1px solid rgba(255,255,255,0.08); }
    .move-btn { flex: 1; background: transparent; border: none; color: var(--text); padding: 8px 0; font-size: 14px; font-weight: 700; cursor: pointer; }
    .move-btn:first-child { border-right: 1px solid rgba(255,255,255,0.08); }
    .move-btn:active { background: var(--surface-light); }
    .move-btn:disabled { opacity: 0.25; pointer-events: none; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 36px 20px; color: var(--text-muted); border: 2px dashed var(--surface-light); border-radius: 16px; }
    .empty-state p { margin: 8px 0 0; font-size: 14px; line-height: 1.4; }
    .bottom-bar { padding: 10px 12px calc(var(--safe-bottom) + 10px); background: var(--surface); border-top: 1px solid rgba(255,255,255,0.08); display: flex; gap: 8px; }
    .btn { flex: 1; padding: 13px 8px; border-radius: 12px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--surface-light); color: var(--text); }
    .btn:disabled { opacity: 0.45; pointer-events: none; }
    .crop-workspace { flex: 1; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none; }
    #cropCanvas { max-width: 100%; max-height: 100%; }
    #magnifier { position: absolute; top: 16px; left: 16px; width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--primary); box-shadow: 0 8px 20px rgba(0,0,0,0.6); display: none; pointer-events: none; background: #000; }
    .crop-hint { position: absolute; bottom: 12px; background: rgba(15, 23, 42, 0.85); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: var(--text); pointer-events: none; }
    .filter-workspace { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }
    #resultCanvas { max-width: 100%; max-height: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background: #fff; }
    .filter-controls { background: var(--surface); padding: 12px 16px 4px; display: flex; gap: 8px; justify-content: center; }
    .filter-pill { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--surface-light); background: var(--bg); color: var(--text-muted); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; }
    .filter-pill.active { background: rgba(14, 165, 233, 0.2); border-color: var(--primary); color: var(--primary); }
    .loader-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; gap: 14px; font-weight: 600; font-size: 15px; }
    .loader-overlay.active { display: flex; }
    .spinner { width: 38px; height: 38px; border: 4px solid var(--surface-light); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    input[type="file"] { display: none; }
  </style>
</head>
<body>

  <div id="loaderOverlay" class="loader-overlay">
    <div class="spinner"></div>
    <div id="loaderText">Processing...</div>
  </div>

  <header>
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>
      MEKOHM <span>SCAN</span>
    </div>
    <div id="cvStatus" class="cv-badge">Loading AI...</div>
  </header>

  <main>
    <section id="viewHome" class="view active">
      <div class="home-container">
        <div class="filename-box">
          <div class="filename-header">
            <label for="pdfName" id="weekLabel">Current Week (Ends Sunday)</label>
            <button id="clearWeekBtn" class="clear-week-btn" onclick="confirmClearWeek()" disabled>🗑️ Clear Week</button>
          </div>
          <div class="filename-input-wrap">
            <input type="text" id="pdfName" autocomplete="off" />
            <span>.pdf</span>
          </div>
          <div class="week-nav">
            <button class="week-btn" onclick="changeWeek(-1)">◀ Prev Week</button>
            <button class="week-btn active-week" id="currentWeekBtn" onclick="setWeekOffset(0)">Current Week</button>
            <button class="week-btn" onclick="changeWeek(1)">Next Week ▶</button>
          </div>
        </div>

        <div id="pagesGrid" class="pages-grid">
          <div class="empty-state">
            <p>Loading history...</p>
          </div>
        </div>
      </div>

      <div class="bottom-bar">
        <button class="btn btn-primary" onclick="triggerCamera()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          Photo
        </button>
        <button class="btn btn-secondary" onclick="triggerFileImport()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path><line x1="12" y1="11" x2="12" y2="17"></line><line x1="9" y1="14" x2="15" y2="14"></line></svg>
          Import
        </button>
        <button id="exportBtn" class="btn btn-accent" onclick="exportPDF()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          PDF (<span id="pageCount">0</span>)
        </button>
      </div>
    </section>

    <section id="viewCrop" class="view">
      <div class="crop-workspace" id="cropWorkspace">
        <canvas id="cropCanvas"></canvas>
        <canvas id="magnifier" width="110" height="110"></canvas>
        <div class="crop-hint">Auto-detected edges — drag blue corners to adjust</div>
      </div>
      <div class="bottom-bar">
        <button class="btn btn-secondary" onclick="showView('viewHome')">Cancel</button>
        <button class="btn btn-secondary" onclick="reDetectCorners()">↻ Auto</button>
        <button class="btn btn-primary" onclick="applyPerspectiveWarp()">Straighten ➔</button>
      </div>
    </section>

    <section id="viewFilter" class="view">
      <div class="filter-workspace"><canvas id="resultCanvas"></canvas></div>
      <div class="filter-controls">
        <div class="filter-pill active" data-filter="orig" onclick="setFilter('orig')">Actual Color</div>
        <div class="filter-pill" data-filter="magic" onclick="setFilter('magic')">Enhanced</div>
        <div class="filter-pill" data-filter="bw" onclick="setFilter('bw')">B&W Doc</div>
      </div>
      <div class="bottom-bar">
        <button class="btn btn-secondary" onclick="showView('viewCrop')">◂ Corners</button>
        <button class="btn btn-secondary" onclick="rotateResult()">↻ 90°</button>
        <button class="btn btn-accent" onclick="saveCurrentPage()">✓ Save</button>
      </div>
    </section>
  </main>

  <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImageFile(event.target.files[0])" />
  <input type="file" id="importInput" accept="application/pdf,image/*" onchange="handleExternalFile(event)" />

  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }

    let cvReady = false;
    let scannedPages = [];
    let originalImage = null;
    let corners = [];
    let activeCornerIndex = -1;
    let displayScale = 1;
    let warpedCanvas = document.createElement('canvas');
    let currentFilter = 'orig';
    let db = null;
    let weekOffset = 0;

    function setLoader(visible, text = 'Processing...') {
      const el = document.getElementById('loaderOverlay');
      document.getElementById('loaderText').textContent = text;
      el.classList.toggle('active', visible);
    }

    // --- TIMESTAMPED COPY BACKUP (METHOD A - iOS SHARE SHEET) ---
    async function sauvegarderCopieHorodatee(donnee, extensionForcee = null) {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const horodatage = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}_${pad(now.getHours())}-${pad(now.getMinutes())}-${pad(now.getSeconds())}`;

      let blob = donnee;
      if (typeof donnee === 'string') {
        const res = await fetch(donnee);
        blob = await res.blob();
      }

      const estPdf = extensionForcee === 'pdf' || blob.type === 'application/pdf';
      const ext = estPdf ? 'pdf' : 'jpg';
      const mimeType = estPdf ? 'application/pdf' : 'image/jpeg';
      const fileName = `${horodatage}.${ext}`;

      const file = new File([blob], fileName, { type: mimeType });

      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file]
            });
          return;
        } catch (err) {
          console.log('Partage annulé');
          return;
        }
      }

      // Fallback sur PC : téléchargement direct
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = fileName;
      a.click();
      URL.revokeObjectURL(url);
    }

    // --- WEEK CALCULATION (Week ends on Sunday) ---
    function getSundayDateForOffset(offset) {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const daysUntilSunday = dayOfWeek === 0 ? 0 : (7 - dayOfWeek);
      return new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysUntilSunday + (offset * 7));
    }

    function formatMMDDYYYY(dateObj) {
      const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dateObj.getDate()).padStart(2, '0');
      const yyyy = dateObj.getFullYear();
      return `${mm}-${dd}-${yyyy}`;
    }

    function getActiveWeekKey() {
      return formatMMDDYYYY(getSundayDateForOffset(weekOffset));
    }

    function updateWeekUI() {
      const weekKey = getActiveWeekKey();
      document.getElementById('pdfName').value = `invoices_${weekKey}`;

      const label = document.getElementById('weekLabel');
      const currentBtn = document.getElementById('currentWeekBtn');

      if (weekOffset === 0) {
        label.textContent = 'Current Week (Ends Sunday)';
        currentBtn.classList.add('active-week');
      } else if (weekOffset < 0) {
        label.textContent = weekOffset === -1 ? 'Previous Week (Archive)' : `${Math.abs(weekOffset)} Weeks Ago (Archive)`;
        currentBtn.classList.remove('active-week');
      } else {
        label.textContent = weekOffset === 1 ? 'Next Week' : `In ${weekOffset} Weeks`;
        currentBtn.classList.remove('active-week');
      }
    }

    async function changeWeek(delta) {
      weekOffset += delta;
      updateWeekUI();
      await loadScansFromDB();
    }

    async function setWeekOffset(offset) {
      weekOffset = offset;
      updateWeekUI();
      await loadScansFromDB();
    }

    // --- LOCAL INDEXEDDB STORAGE ---
    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('MekohmScanDB_v2', 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('scans')) {
            const store = database.createObjectStore('scans', { keyPath: 'id', autoIncrement: true });
            store.createIndex('weekKey', 'weekKey', { unique: false });
          }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(db); };
        req.onerror = (e) => reject(e);
      });
    }

    async function loadScansFromDB() {
      if (!db) await initDB();
      const activeKey = getActiveWeekKey();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readonly');
        const store = tx.objectStore('scans');
        const req = store.getAll();
        req.onsuccess = () => {
          const allItems = req.result || [];
          const filtered = allItems.filter(item => item.weekKey === activeKey);
          filtered.sort((a, b) => (a.order ?? a.id) - (b.order ?? b.id));
          scannedPages = filtered;
          renderPagesGrid();
          resolve();
        };
      });
    }

    async function addScanToDB(scanObj) {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readwrite');
        const req = tx.objectStore('scans').add(scanObj);
        req.onsuccess = () => resolve(req.result);
      });
    }

    async function updateAllScansOrderInDB() {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readwrite');
        const store = tx.objectStore('scans');
        scannedPages.forEach((item, idx) => { item.order = idx; store.put(item); });
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteScanFromDB(id) {
      if (!db) await initDB();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readwrite');
        tx.objectStore('scans').delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    async function clearCurrentWeekFromDB() {
      if (!db) await initDB();
      const activeKey = getActiveWeekKey();
      return new Promise((resolve) => {
        const tx = db.transaction('scans', 'readwrite');
        const store = tx.objectStore('scans');
        const req = store.getAll();
        req.onsuccess = () => {
          (req.result || []).forEach(item => {
            if (item.weekKey === activeKey) store.delete(item.id);
          });
        };
        tx.oncomplete = () => resolve();
      });
    }

    updateWeekUI();
    loadScansFromDB();

    function onOpenCvReady() {
      cvReady = true;
      const badge = document.getElementById('cvStatus');
      badge.textContent = 'AI Ready';
      badge.classList.add('ready');
    }

    function showView(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function triggerCamera() {
      const input = document.getElementById('cameraInput');
      input.value = '';
      input.click();
    }

    function triggerFileImport() {
      const input = document.getElementById('importInput');
      input.value = '';
      input.click();
    }

    async function handleExternalFile(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf')) {
        await importExternalPDF(file);
      } else if (file.type.startsWith('image/')) {
        handleImageFile(file);
      } else {
        alert('Unsupported file format. Please choose a PDF or an image.');
      }
    }

    // Compact PDF import (1.35x scale, 0.72 JPEG quality)
    async function importExternalPDF(file) {
      if (!window.pdfjsLib) {
        alert('PDF reader is still loading, please try again in 2 seconds.');
        return;
      }

      setLoader(true, 'Reading external PDF...');
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const totalPages = pdfDoc.numPages;

        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' +
                        now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

        const activeKey = getActiveWeekKey();

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          setLoader(true, `Importing page ${pageNum} / ${totalPages}...`);
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.35 });

          const canvas = document.createElement('canvas');
          canvas.width = Math.round(viewport.width);
          canvas.height = Math.round(viewport.height);
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const newScan = {
            weekKey: activeKey,
            dataUrl: canvas.toDataURL('image/jpeg', 0.72),
            width: canvas.width,
            height: canvas.height,
            timestamp: `PDF • ${dateStr}`,
            isFullPage: true,
            order: scannedPages.length
          };

          const id = await addScanToDB(newScan);
          newScan.id = id;
          scannedPages.push(newScan);
        }

        renderPagesGrid();
        setLoader(false);
        await sauvegarderCopieHorodatee(file, 'pdf');
      } catch (err) {
        console.error(err);
        alert('Unable to read this PDF file (it may be password-protected).');
        setLoader(false);
      }
    }

    function handleImageFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const maxDim = 1300;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = w; tempCanvas.height = h;
          tempCanvas.getContext('2d').drawImage(img, 0, 0, w, h);
          originalImage = new Image();
          originalImage.onload = function() {
            currentFilter = 'orig';
            detectDocumentCorners();
            showView('viewCrop');
            drawCropCanvas();
          };
          originalImage.src = tempCanvas.toDataURL('image/jpeg', 0.85);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function reDetectCorners() {
      if (!originalImage) return;
      detectDocumentCorners();
      drawCropCanvas();
    }

    // --- MULTI-PASS AUTO-DETECTION FOR RECEIPTS & INVOICES ---
    function findBestQuadFromBinary(binaryMat, imgW, imgH, scale) {
      const contours = new cv.MatVector();
      const hierarchy = new cv.Mat();
      cv.findContours(binaryMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

      const totalArea = imgW * imgH;
      const minArea = totalArea * 0.06;
      const maxArea = totalArea * 0.96;

      let bestPts = null;
      let bestScore = 0;

      for (let i = 0; i < contours.size(); ++i) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);

        if (area >= minArea && area <= maxArea) {
          const peri = cv.arcLength(cnt, true);
          let quadFound = null;

          for (const eps of [0.02, 0.035, 0.05]) {
            const approx = new cv.Mat();
            cv.approxPolyDP(cnt, approx, eps * peri, true);
            if (approx.rows === 4 && cv.isContourConvex(approx)) {
              quadFound = approx;
              break;
            }
            approx.delete();
          }

          let rawPts = null;
          if (quadFound) {
            rawPts = [];
            for (let k = 0; k < 4; k++) {
              rawPts.push({
                x: quadFound.data32S[k * 2] / scale,
                y: quadFound.data32S[k * 2 + 1] / scale
              });
            }
            quadFound.delete();
          } else if (area > totalArea * 0.14) {
            const rotRect = cv.minAreaRect(cnt);
            const vertices = cv.RotatedRect.points(rotRect);
            const rectArea = rotRect.size.width * rotRect.size.height;
            if (rectArea > 0 && (area / rectArea) > 0.78) {
              rawPts = vertices.map(v => ({ x: v.x / scale, y: v.y / scale }));
            }
          }

          if (rawPts) {
            const ordered = orderCorners(rawPts);
            const topW = Math.hypot(ordered[1].x - ordered[0].x, ordered[1].y - ordered[0].y);
            const botW = Math.hypot(ordered[2].x - ordered[3].x, ordered[2].y - ordered[3].y);
            const leftH = Math.hypot(ordered[3].x - ordered[0].x, ordered[3].y - ordered[0].y);
            const rightH = Math.hypot(ordered[2].x - ordered[1].x, ordered[2].y - ordered[1].y);

            const avgW = (topW + botW) / 2;
            const avgH = (leftH + rightH) / 2;
            const aspect = Math.max(avgW, avgH) / Math.max(1, Math.min(avgW, avgH));

            if (aspect <= 5.5 && avgW > 40 && avgH > 40) {
              const cx = ordered.reduce((s, p) => s + p.x, 0) / 4;
              const cy = ordered.reduce((s, p) => s + p.y, 0) / 4;
              const origW = imgW / scale, origH = imgH / scale;
              const distCenter = Math.hypot(cx - origW / 2, cy - origH / 2) / Math.hypot(origW / 2, origH / 2);
              const score = area * (1.25 - 0.35 * distCenter);

              if (score > bestScore) {
                bestScore = score;
                bestPts = ordered;
              }
            }
          }
        }
        cnt.delete();
      }

      contours.delete();
      hierarchy.delete();
      return { pts: bestPts, score: bestScore };
    }

    function expandCornersSlightly(pts, origW, origH, padRatio = 0.015) {
      const cx = pts.reduce((s, p) => s + p.x, 0) / 4;
      const cy = pts.reduce((s, p) => s + p.y, 0) / 4;
      return pts.map(p => ({
        x: Math.max(0, Math.min(origW, Math.round(cx + (p.x - cx) * (1 + padRatio)))),
        y: Math.max(0, Math.min(origH, Math.round(cy + (p.y - cy) * (1 + padRatio))))
      }));
    }

    function detectDocumentCorners() {
      const w = originalImage.width, h = originalImage.height;
      const defaultCorners = [
        { x: Math.round(w * 0.08), y: Math.round(h * 0.08) },
        { x: Math.round(w * 0.92), y: Math.round(h * 0.08) },
        { x: Math.round(w * 0.92), y: Math.round(h * 0.92) },
        { x: Math.round(w * 0.08), y: Math.round(h * 0.92) }
      ];
      if (!cvReady) { corners = defaultCorners; return; }

      try {
        const src = cv.imread(originalImage);
        const proc = new cv.Mat();
        const scale = 550 / Math.max(w, h);
        const dsize = new cv.Size(Math.round(w * scale), Math.round(h * scale));
        cv.resize(src, proc, dsize, 0, 0, cv.INTER_AREA);

        const gray = new cv.Mat();
        cv.cvtColor(proc, gray, cv.COLOR_RGBA2GRAY, 0);

        const blurred = new cv.Mat();
        cv.GaussianBlur(gray, blurred, new cv.Size(5, 5), 0);

        const morphKernel = cv.Mat.ones(7, 7, cv.CV_8U);
        let bestOverall = { pts: null, score: 0 };

        // Pass 1: Canny edge detection + morphological closing
        const edged1 = new cv.Mat();
        cv.Canny(blurred, edged1, 40, 130);
        cv.morphologyEx(edged1, edged1, cv.MORPH_CLOSE, morphKernel);
        cv.dilate(edged1, edged1, cv.Mat.ones(3, 3, cv.CV_8U));
        const res1 = findBestQuadFromBinary(edged1, dsize.width, dsize.height, scale);
        if (res1.score > bestOverall.score) bestOverall = res1;
        edged1.delete();

        // Pass 2: Adaptive threshold (white paper on wood/countertop)
        if (!bestOverall.pts) {
          const thresh = new cv.Mat();
          cv.adaptiveThreshold(blurred, thresh, 255, cv.ADAPTIVE_THRESH_GAUSSIAN_C, cv.THRESH_BINARY, 21, -4);
          cv.morphologyEx(thresh, thresh, cv.MORPH_CLOSE, morphKernel);
          const res2 = findBestQuadFromBinary(thresh, dsize.width, dsize.height, scale);
          if (res2.score > bestOverall.score) bestOverall = res2;
          thresh.delete();
        }

        // Pass 3: Otsu threshold (high contrast)
        if (!bestOverall.pts) {
          const otsu = new cv.Mat();
          cv.threshold(blurred, otsu, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
          cv.morphologyEx(otsu, otsu, cv.MORPH_CLOSE, morphKernel);
          const res3 = findBestQuadFromBinary(otsu, dsize.width, dsize.height, scale);
          if (res3.score > bestOverall.score) bestOverall = res3;
          otsu.delete();
        }

        if (bestOverall.pts) {
          corners = expandCornersSlightly(bestOverall.pts, w, h, 0.015);
        } else {
          corners = defaultCorners;
        }

        src.delete(); proc.delete(); gray.delete(); blurred.delete(); morphKernel.delete();
      } catch (err) {
        console.warn('Auto-detect fallback:', err);
        corners = defaultCorners;
      }
    }

    function orderCorners(pts) {
      const sortedBySum = [...pts].sort((a, b) => (a.x + a.y) - (b.x + b.y));
      const tl = sortedBySum[0], br = sortedBySum[3], rem = [sortedBySum[1], sortedBySum[2]];
      return [tl, rem[0].x > rem[1].x ? rem[0] : rem[1], br, rem[0].x > rem[1].x ? rem[1] : rem[0]];
    }

    function drawCropCanvas() {
      const workspace = document.getElementById('cropWorkspace'), canvas = document.getElementById('cropCanvas'), ctx = canvas.getContext('2d');
      displayScale = Math.min((workspace.clientWidth - 24) / originalImage.width, (workspace.clientHeight - 24) / originalImage.height);
      canvas.width = Math.round(originalImage.width * displayScale);
      canvas.height = Math.round(originalImage.height * displayScale);
      ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);
      ctx.save(); ctx.fillStyle = 'rgba(0, 0, 0, 0.55)'; ctx.beginPath(); ctx.rect(0, 0, canvas.width, canvas.height);
      ctx.moveTo(corners[0].x * displayScale, corners[0].y * displayScale);
      for (let i = 3; i >= 0; i--) ctx.lineTo(corners[i].x * displayScale, corners[i].y * displayScale);
      ctx.closePath(); ctx.fill('evenodd'); ctx.restore();
      ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 3; ctx.beginPath();
      corners.forEach((pt, idx) => { const x = pt.x * displayScale, y = pt.y * displayScale; idx === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
      ctx.closePath(); ctx.stroke();
      corners.forEach((pt, idx) => {
        ctx.beginPath(); ctx.arc(pt.x * displayScale, pt.y * displayScale, idx === activeCornerIndex ? 16 : 12, 0, Math.PI * 2);
        ctx.fillStyle = idx === activeCornerIndex ? '#38bdf8' : '#0ea5e9'; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      });
    }

    const cropCanvas = document.getElementById('cropCanvas'), magnifier = document.getElementById('magnifier');
    function getPointerPos(e) {
      const rect = cropCanvas.getBoundingClientRect();
      return { x: ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / displayScale, y: ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / displayScale };
    }
    function onPointerDown(e) {
      e.preventDefault(); const pos = getPointerPos(e); let minDist = 60 / displayScale; activeCornerIndex = -1;
      corners.forEach((pt, idx) => { const dist = Math.hypot(pt.x - pos.x, pt.y - pos.y); if (dist < minDist) { minDist = dist; activeCornerIndex = idx; } });
      if (activeCornerIndex !== -1) { updateMagnifier(corners[activeCornerIndex]); drawCropCanvas(); }
    }
    function onPointerMove(e) {
      if (activeCornerIndex === -1) return; e.preventDefault(); const pos = getPointerPos(e);
      corners[activeCornerIndex] = { x: Math.max(0, Math.min(originalImage.width, Math.round(pos.x))), y: Math.max(0, Math.min(originalImage.height, Math.round(pos.y))) };
      updateMagnifier(corners[activeCornerIndex]); drawCropCanvas();
    }
    function onPointerUp() { activeCornerIndex = -1; magnifier.style.display = 'none'; drawCropCanvas(); }
    function updateMagnifier(pt) {
      magnifier.style.display = 'block'; const mCtx = magnifier.getContext('2d'), size = 110 / 1.6;
      mCtx.clearRect(0, 0, 110, 110); mCtx.drawImage(originalImage, pt.x - size / 2, pt.y - size / 2, size, size, 0, 0, 110, 110);
      mCtx.strokeStyle = '#0ea5e9'; mCtx.lineWidth = 2; mCtx.beginPath(); mCtx.moveTo(55, 42); mCtx.lineTo(55, 68); mCtx.moveTo(42, 55); mCtx.lineTo(68, 55); mCtx.stroke();
    }
    cropCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
    cropCanvas.addEventListener('touchmove', onPointerMove, { passive: false });
    cropCanvas.addEventListener('touchend', onPointerUp);
    cropCanvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    function applyPerspectiveWarp() {
      const [tl, tr, br, bl] = corners;
      const targetW = Math.round(Math.max(Math.hypot(tr.x - tl.x, tr.y - tl.y), Math.hypot(br.x - bl.x, br.y - bl.y)));
      const targetH = Math.round(Math.max(Math.hypot(bl.x - tl.x, bl.y - tl.y), Math.hypot(br.x - tr.x, br.y - tr.y)));
      warpedCanvas.width = targetW; warpedCanvas.height = targetH;
      if (cvReady) {
        const src = cv.imread(originalImage), dst = new cv.Mat();
        const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [tl.x, tl.y, tr.x, tr.y, br.x, br.y, bl.x, bl.y]);
        const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [0, 0, targetW, 0, targetW, targetH, 0, targetH]);
        const M = cv.getPerspectiveTransform(srcTri, dstTri);
        cv.warpPerspective(src, dst, M, new cv.Size(targetW, targetH), cv.INTER_LINEAR, cv.BORDER_CONSTANT, new cv.Scalar());
        cv.imshow(warpedCanvas, dst);
        src.delete(); dst.delete(); srcTri.delete(); dstTri.delete(); M.delete();
      } else {
        warpedCanvas.getContext('2d').drawImage(originalImage, Math.min(tl.x, bl.x), Math.min(tl.y, tr.y), targetW, targetH, 0, 0, targetW, targetH);
      }
      setFilter(currentFilter); showView('viewFilter');
    }

    function setFilter(type) {
      currentFilter = type;
      document.querySelectorAll('.filter-pill').forEach(el => el.classList.toggle('active', el.dataset.filter === type));
      const resCanvas = document.getElementById('resultCanvas');
      resCanvas.width = warpedCanvas.width; resCanvas.height = warpedCanvas.height;
      const ctx = resCanvas.getContext('2d'); ctx.drawImage(warpedCanvas, 0, 0);
      if (type === 'orig') return;
      const imgData = ctx.getImageData(0, 0, resCanvas.width, resCanvas.height), data = imgData.data;
      if (type === 'bw') {
        for (let i = 0; i < data.length; i += 4) {
          const lum = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          let val = (lum - 128) * 1.85 + 145;
          val = val > 210 ? 255 : (val < 45 ? 0 : val);
          data[i] = data[i + 1] = data[i + 2] = val;
        }
      } else if (type === 'magic') {
        for (let i = 0; i < data.length; i += 4) {
          for (let c = 0; c < 3; c++) data[i + c] = Math.max(0, Math.min(255, (data[i + c] - 128) * 1.45 + 140));
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    function rotateResult() {
      const temp = document.createElement('canvas');
      temp.width = warpedCanvas.height; temp.height = warpedCanvas.width;
      const tCtx = temp.getContext('2d');
      tCtx.translate(temp.width / 2, temp.height / 2); tCtx.rotate(Math.PI / 2);
      tCtx.drawImage(warpedCanvas, -warpedCanvas.width / 2, -warpedCanvas.height / 2);
      warpedCanvas = temp; setFilter(currentFilter);
    }

    async function saveCurrentPage() {
      const resCanvas = document.getElementById('resultCanvas');
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' +
                      now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });

      const imageDataUrl = resCanvas.toDataURL('image/jpeg', 0.68);

      const newScan = {
        weekKey: getActiveWeekKey(),
        dataUrl: imageDataUrl,
        width: resCanvas.width,
        height: resCanvas.height,
        timestamp: dateStr,
        isFullPage: false,
        order: scannedPages.length
      };

      const id = await addScanToDB(newScan);
      newScan.id = id;
      scannedPages.push(newScan);
      renderPagesGrid();
      showView('viewHome');

      // Sauvegarde automatique horodatée via le menu Partager iOS
      await sauvegarderCopieHorodatee(imageDataUrl, 'jpg');
    }

    async function movePage(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= scannedPages.length) return;
      const temp = scannedPages[index];
      scannedPages[index] = scannedPages[targetIndex];
      scannedPages[targetIndex] = temp;
      renderPagesGrid();
      await updateAllScansOrderInDB();
    }

    async function deletePage(index) {
      const item = scannedPages[index];
      if (!item) return;
      await deleteScanFromDB(item.id);
      scannedPages.splice(index, 1);
      await updateAllScansOrderInDB();
      renderPagesGrid();
    }

    async function confirmClearWeek() {
      if (scannedPages.length === 0) return;
      if (confirm(`Delete all ${scannedPages.length} invoices from this week (${getActiveWeekKey()})?`)) {
        await clearCurrentWeekFromDB();
        scannedPages = [];
        renderPagesGrid();
      }
    }

    function renderPagesGrid() {
      const grid = document.getElementById('pagesGrid');
      const exportBtn = document.getElementById('exportBtn');
      const clearBtn = document.getElementById('clearWeekBtn');

      document.getElementById('pageCount').textContent = scannedPages.length;
      exportBtn.disabled = scannedPages.length === 0;
      clearBtn.disabled = scannedPages.length === 0;

      if (scannedPages.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.8">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <p>No invoices saved for this week.<br>Tap <strong>Photo</strong> to scan a receipt or <strong>Import</strong> to add an external PDF or image.</p>
          </div>`;
        return;
      }

      grid.innerHTML = scannedPages.map((p, idx) => `
        <div class="page-card">
          <div class="page-thumb">
            <img src="${p.dataUrl}" alt="Page ${idx + 1}" />
            <div class="page-badge">#${idx + 1}</div>
            <button class="delete-page" onclick="deletePage(${idx})">×</button>
            <div class="page-date">${p.timestamp || ''}</div>
          </div>
          <div class="card-controls">
            <button class="move-btn" onclick="movePage(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>◀</button>
            <button class="move-btn" onclick="movePage(${idx}, 1)" ${idx === scannedPages.length - 1 ? 'disabled' : ''}>▶</button>
          </div>
        </div>
      `).join('');
    }

    // --- CHRONOLOGICAL MULTI-COLUMN PDF PACKING (11 x 8.5 in LANDSCAPE) ---
    async function exportPDF() {
      if (scannedPages.length === 0) return;
      const { jsPDF } = window.jspdf;

      // Exact 11 x 8.5 inches Landscape in points (792 x 612 pt)
      const pageW = 792;
      const pageH = 612;
      const margin = 24;
      const colGap = 12;
      const rowGap = 14;
      const labelH = 11;

      const usableW = pageW - margin * 2;
      const usableH = pageH - margin * 2;

      const pdf = new jsPDF({
        orientation: 'l',
        unit: 'pt',
        format: [pageW, pageH],
        compress: true
      });

      let cursorX = margin;
      let cursorY = margin;
      let currentRowMaxH = 0;

      scannedPages.forEach((item, index) => {
        const aspect = item.width / Math.max(1, item.height);

        let targetW;
        if (!item.isFullPage && aspect < 0.58) {
          targetW = (usableW - colGap * 3) / 4;
        } else if (!item.isFullPage && aspect < 0.85) {
          targetW = (usableW - colGap * 2) / 3;
        } else if (!item.isFullPage && aspect < 1.25) {
          targetW = (usableW - colGap) / 2;
        } else {
          targetW = usableW;
        }

        let drawW = targetW;
        let drawH = drawW / aspect;

        const maxSingleH = usableH - labelH;
        if (drawH > maxSingleH) {
          drawH = maxSingleH;
          drawW = drawH * aspect;
        }

        const totalBlockH = drawH + labelH;

        if (cursorX > margin && (cursorX + drawW > pageW - margin + 1)) {
          cursorX = margin;
          cursorY += currentRowMaxH + rowGap;
          currentRowMaxH = 0;
        }

        if (cursorY > margin && (cursorY + totalBlockH > pageH - margin + 1)) {
          pdf.addPage([pageW, pageH], 'l');
          cursorX = margin;
          cursorY = margin;
          currentRowMaxH = 0;
        }

        pdf.setFont('helvetica', 'bold');
        pdf.setFontSize(8);
        pdf.setTextColor(100, 116, 139);
        pdf.text(`#${index + 1}`, cursorX, cursorY + 8);

        pdf.addImage(item.dataUrl, 'JPEG', cursorX, cursorY + labelH, drawW, drawH, undefined, 'MEDIUM');

        pdf.setDrawColor(210, 215, 222);
        pdf.setLineWidth(0.5);
        pdf.rect(cursorX, cursorY + labelH, drawW, drawH);

        cursorX += drawW + colGap;
        if (totalBlockH > currentRowMaxH) {
          currentRowMaxH = totalBlockH;
        }
      });

      const rawName = (document.getElementById('pdfName').value.trim() || `invoices_${getActiveWeekKey()}`).replace(/[^a-zA-Z0-9_\-]/g, '_');
      const fileName = `${rawName}.pdf`;
      const pdfFile = new File([pdf.output('blob')], fileName, { type: 'application/pdf' });

      if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
        try {
          await navigator.share({ files: [pdfFile] });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return;
        }
      }
      pdf.save(fileName);
    }
  </script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Mekohm Scan prêt pour le mode hors-ligne'))
          .catch((err) => console.error('Erreur Service Worker :', err));
      });
    }
  </script>
